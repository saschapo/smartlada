# nginx server block for smartlada.saschapo.me (static page from site/public/).
# Lives at /etc/nginx/sites-available/smartlada, symlinked into sites-enabled.
# Isolated from the saschapo.me and cineink.saschapo.me blocks -- do NOT edit those.
#
#   scp site/deploy/nginx-smartlada.conf vps:/etc/nginx/sites-available/smartlada
#   ssh vps 'ln -sf /etc/nginx/sites-available/smartlada /etc/nginx/sites-enabled/smartlada \
#            && mkdir -p /var/www/smartlada && nginx -t && systemctl reload nginx'
#   ssh vps 'certbot --nginx -d smartlada.saschapo.me --redirect'   # adds the 443 block + cert
#
# certbot rewrites this file in place; the copy in git is the pre-certbot template.

server {
    listen 80;
    server_name smartlada.saschapo.me;

    root /var/www/smartlada;
    index index.html;
    charset utf-8;
    charset_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/manifest+json;
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # File names are not hashed, so keep the cache modest: a re-export shows up within a week.
    location ~* ^/(img|fonts)/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
